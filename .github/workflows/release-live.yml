name: Production release check

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: "Deployed origin to verify"
        required: true
        default: "https://brandspaces.in"
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-check
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Verify deployed site
        env:
          RELEASE_URL: ${{ inputs.release_url }}
        run: npm run release:check:live
