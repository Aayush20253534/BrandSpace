name: Quality and security

on:
  push:
    branches:
      - main
      - claude/brandspace-website-build-3g7vaw
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Performance budgets
        run: npm run perf:check

      - name: Source security checks
        run: npm run security:check

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://brandspaces.in
        run: npm run build

      - name: Release source gate
        run: npm run release:source
